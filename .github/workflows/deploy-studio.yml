name: Deploy Studio

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'libs/studio-protocol/**'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter sdd-studio-web test

      - name: Build static export
        run: pnpm --filter sdd-studio-web build:local

      # Same hosting as the docs: a Pages project + a CNAME at the DNS provider.
      - name: Ensure the Pages project exists
        working-directory: apps/studio
        run: |
          if ! pnpm exec wrangler pages project list | grep -qw 'sdd-studio'; then
            pnpm exec wrangler pages project create sdd-studio --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: apps/studio
        run: pnpm exec wrangler pages deploy out --project-name sdd-studio --branch main
