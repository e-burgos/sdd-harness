name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'apps/documentation/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar el status ci-local y correr todo el CI'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  local:
    name: ci-local status
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      verified: ${{ steps.local.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - name: Buscar status ci-local (pnpm ci:local)
        id: local
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$FORCE" = "true" ]; then
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "force=true: corre el CI completo"
            exit 0
          fi
          bash scripts/ci/wait-ci-local-status.sh "${{ github.repository }}" "$sha" >> "$GITHUB_OUTPUT"
          grep -q 'verified=true' "$GITHUB_OUTPUT" && echo "ci-local en success sobre $sha: se saltea el CI pesado" || echo "sin status ci-local sobre $sha: corre el CI completo"

  sdd-validate:
    name: sdd:validate
    needs: local
    if: needs.local.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm sdd:validate

  test:
    name: build · typecheck · test
    needs: local
    if: needs.local.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SDD_RTK_SKIP_INSTALL: '1'

  e2e:
    name: studio e2e (playwright)
    needs: local
    if: needs.local.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter sdd-studio-web exec playwright install --with-deps chromium
      - run: pnpm --filter sdd-studio-web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/studio/test-results
