name: SDD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdd-validate:
    name: sdd:validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the validator dependencies
        run: npm install --prefix sdd --no-save --no-package-lock --ignore-scripts --no-audit --no-fund ajv@^8.20.0 ajv-formats@^3.0.1
      - run: node sdd/scripts/validate-sdd.mjs
