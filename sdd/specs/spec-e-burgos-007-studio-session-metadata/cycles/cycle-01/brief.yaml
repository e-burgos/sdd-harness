objective: |
  Que Studio muestre el título real de la sesión del proveedor, conserve todas las asociaciones
  (spec, ciclo, fix) de una conversación de forma persistente y vea todos los documentos que
  generó, incluidos los escritos por Bash o scripts, gracias a un evento estructurado
  document.touched emitido por el puente. Los hilos viejos siguen funcionando por heurística.

scope:
  - US-1 sessionTitle opcional en ThreadInfo (libs/studio-protocol); el puente lo lee con getSessionInfo(sessionId) del SDK (customTitle, si no summary) y lo publica; ConversationSessionInfo lo muestra
  - US-2 ThreadLink.targets[] aditivo y persistido, compatible con link.target; el puente persiste detectadas y manuales; migración de threads.json viejos
  - US-3 Evento ThreadEvent document.touched {path, op, author, seq} emitido para Write/Edit/MultiEdit y para cambios en sdd/ durante tools Bash; revisión del recorte de 160 caracteres de summaries Bash (apps/studio-bridge/src/engine/tool-summary.ts:8)
  - US-3 La web prefiere document.touched y cae a la heurística de FIX-e-burgos-005-006 (lib/conversation.ts) para hilos sin el evento

out_of_scope:
  - Renombrar sesiones desde la web
  - Motores de otros proveedores
  - FIX-e-burgos-005-001..011 (quedan para el reviewer; no se reabren)
  - Vigilar escrituras fuera de sdd/ durante Bash

dependencies_required:
  - spec-e-burgos-005-studio-conversation-sessions (completed)

