    business_context: |
      SDD Studio es la UI web (apps/studio) que habla por WebSocket con un puente local
      (apps/studio-bridge) que corre agentes con Claude Agent SDK. Cada hilo es una conversación.
      El puente ya da una sesión por hilo, pero la web no la ve y Mission Control muestra guiones
      inventados (proveedores Gemini/Copilot y sesiones que nunca existieron). El dev decidió:
      prefijo de sistema estable para caching (sin resumen) y arquitectura preparada para varios
      proveedores con solo Claude implementado.
    relevant_spec_sections:
