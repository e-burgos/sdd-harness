cycle: 1
module: studio-conversation-sessions
phase: conversation-sessions
flow: full
date: 2026-10-25
estimated_weeks: 1
app_context: sdd/context/apps/studio/context_prompt.md

objective: |
  Que cada conversación de SDD Studio sea una sesión real y propia del proveedor. La web ve esa
  sesión y su proveedor, el contexto estable del proyecto se cachea y Mission Control muestra
  solo lo que pasó de verdad en la conversación elegida.

scope:
  - US-1 Nueva conversación = sesión nueva; auditar Composer y LiveAgentChatFeed; botón "Nueva conversación"; prohibido reutilizar sesión entre hilos
  - US-2 engineSessionId y provider en ThreadInfo (libs/studio-protocol); toThreadInfo deja de borrarlos (ajustar store.spec.ts)
  - US-3 Prefijo de sistema estable (context_prompt.md, constitution.md, lessons.md) para prompt caching de Claude
  - US-4 Selector de conversación en Mission Control; specs/fixes derivados de eventos; default = lastActivity más reciente
  - US-5 Borrar guiones ficticios de swarm-dialogue.ts y selectores spec/fix; conservar DocumentViewerModal y lib/agent-documents.ts
  - Campo provider en protocolo e interfaz del motor (arquitectura multi-proveedor)

out_of_scope:
  - Motores Gemini o Copilot (solo se prepara la arquitectura)
  - Resumen o compactación por sesión (descartado por el dev)
  - Fallback de cifras ficticias de LiveTelemetryHUD, salvo que el dev lo incluya (hallazgo de la spec)

dependencies_required:
  - spec-e-burgos-001-studio-session-ux (completed)
  - spec-e-burgos-004-studio-gates-topology (completed)
  - FIX-e-burgos-004-001 (absorbed en esta spec; inventario de falsedades que limpia US-5)

