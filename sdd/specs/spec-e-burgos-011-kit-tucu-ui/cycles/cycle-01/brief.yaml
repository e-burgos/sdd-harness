objective: |
  Integración opcional de tucu-ui en el kit: interruptor tucu_ui en sdd/tools.json con pnpm sdd:tucu,
  skill tucu-ui-design enlazada en los cuatro arneses desde un lugar del proyecto, servidor MCP en
