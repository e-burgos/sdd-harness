risks:
  - id: R-C2-1
    title: "Tamaño del frame con PDFs"
    detail: "Los PDF no se recomprimen: la escalera solo actúa sobre imágenes. Un PDF grande o varios adjuntos en base64 superan FRAME_BUDGET_BYTES (base64 infla ~33%)."
    mitigation: "Medir sobre JSON.stringify del comando completo (no sobre bytes crudos); error explícito con exceso y los dos adjuntos más pesados, Composer conserva todo; maxPayload del puente = MAX_FRAME_BYTES; tests con PDF en el límite y con 5 adjuntos."
  - id: R-C2-2
    title: "Seguridad de rutas en búsqueda de archivos y attachment.get"
    detail: "workspace.searchFiles podría filtrar secretos o rutas fuera del root; attachment.get podría usarse para traversal si la ruta sale del input."
    mitigation: "searchFiles: solo rutas relativas POSIX normalizadas, exclusiones y patrones de secretos de D-08, nunca lee contenido, symlinks resueltos dentro del root. attachment.get: ruta derivada solo de ^[a-f0-9]{64}$ + EXT_BY_MIME, realpath dentro de .sdd-studio/attachments/, archivo regular ≤ MAX_FRAME_BYTES, sha256 recalculado, si no → not-found. Tests de traversal, symlink y .env obligatorios."
  - id: R-C2-3
    title: "Crecimiento de .sdd-studio/attachments/"
    detail: "Sin borrado (RN-12), la carpeta crece con el uso."
    mitigation: "Dedupe por hash + re-encode reducen tamaño; suma de tamaños no bloqueante al iniciar con aviso >1 GiB; prune queda registrado como trabajo posterior."
  - id: R-C2-4
    title: "Compatibilidad con la web publicada"
    detail: "La web en Cloudflare y el puente de npm pueden quedar desfasados respecto de esta rama; un puente de cycle-01 responde unsupported y una web vieja no conoce los features nuevos."
    mitigation: "Sin bump; todo detrás de Welcome.features (attachments, file-search, catalog): la web oculta la UI si el puente no la anuncia y el puente sigue validando campos opcionales. Test de handshake con features ausentes. No usar next dev desde esta rama para el Studio de uso diario (HMR rompe el handshake con el puente publicado)."
  - id: R-C2-5
    title: "Watcher de .claude"
    detail: ".claude/worktrees/ contiene copias del repo; vigilar .claude entero dispara eventos masivos."
    mitigation: "Segundo chokidar.watch acotado a .claude/agents/** y .claude/skills/** con depth 3 (D-09)."

