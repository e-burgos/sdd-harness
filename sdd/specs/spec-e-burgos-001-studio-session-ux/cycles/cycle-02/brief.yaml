objective: |
  Al cerrar el ciclo, el dev adjunta imágenes (png/jpg/webp/gif, achicadas a ≤1568 px y
  re-encodeadas siempre para quitar EXIF/GPS), PDF y texto/código/markdown pegando, arrastrando o
  eligiendo; ve el preview y puede quitar; hasta 5 por mensaje y con el frame ≤ 1 MiB medido sobre el
  JSON serializado. Los adjuntos llegan al agente como bloques image/document/text, se persisten en
  .sdd-studio/attachments/<sha256>.<ext> y se vuelven a ver al recargar vía attachment.get. Con `@`
  busca archivos del repo (búsqueda segura, el agente recibe la ruta) y agentes; con `/` usa skills y
  prompts descubiertos del repo. El borrador por hilo conserva también los adjuntos. Con esto la spec
  queda completa.

