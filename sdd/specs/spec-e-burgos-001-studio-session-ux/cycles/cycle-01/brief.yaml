dependencies_required: []

current_state:
  approvals:
    summary: |
      'Always (thread)' existe como allowlist en memoria por hilo (Live.alwaysAllow). alwaysKeyOf
      devuelve null para EDIT_TOOLS y mcp__* → el scope 'thread' se degrada a 'once'; Bash usa
      'Bash:<cmd literal>'; el resto, el nombre de la herramienta. Los warn del gate re-preguntan
      (se mantiene). canUseTool no usa suggestions/updatedPermissions del SDK. La tarjeta no muestra
      qué regla se recuerda.
    key_files:
      - apps/studio/src/components/workspace/ApprovalCard.tsx            # Approve / Always (thread) / Deny; RespondFn(decision, scope, reason)
      - apps/studio/src/components/workspace/ThreadView.tsx              # envía approval.respond
      - libs/studio-protocol/src/commands.ts                             # approval.respond {approvalId, decision, reason?, scope: once|thread}
      - libs/studio-protocol/src/events.ts                               # approval.requested {tool, summary, diff?, input? 16KB, gateWarning?}; approval.resolved
      - apps/studio-bridge/src/sessions/session-manager.ts               # alwaysKeyOf, Live.alwaysAllow, respondApproval, requestApproval
      - apps/studio-bridge/src/engine/claude-sdk-engine.ts               # canUseTool → requestApproval; PreToolUse → judgeTool (deny / warn→ask)
      - apps/studio-bridge/src/gate/judge.ts                             # EDIT_TOOLS
  composer_and_messages:
    summary: |
      Solo texto plano. thread.send/thread.create llevan text (zod string 1..100_000); user.message
      es {text}. El puente llama query({prompt: string}) — sin streaming input ni content blocks.
      ws-server.ts fija maxPayload = 1_048_576 (cierre 1009, listener de error para no caer); el
      cliente no mide el frame. Hilos persistidos como JSONL (.sdd-studio/threads/<id>.jsonl) y
      reenviados por thread.history. Sin adjuntos. '/' se parsea en lib/slash.ts con un mapa fijo
      de prompts (open-cycle, review, hotfix, check, resume, steward) + run gate|validate. No hay
      menú '@' ni comando para buscar/listar archivos (solo workspace.readFile, máx 2 MiB, con
      safePathWithinRoot). El snapshot descubre agentes solo de sdd/agents; skills no se descubren.
    key_files:
      - apps/studio/src/components/workspace/Composer.tsx               # ComposerView + Composer.send; MAX_MESSAGE 100_000
      - apps/studio/src/lib/slash.ts                                    # PROMPT_COMMANDS, parseSlash
      - apps/studio/src/lib/bridge/client.ts                            # ws.send(JSON.stringify(...)) sin pre-chequeo
      - libs/studio-protocol/src/commands.ts                            # Text, thread.create/send, workspace.readFile, command.run
      - libs/studio-protocol/src/events.ts                              # user.message {text}
      - libs/studio-protocol/src/snapshot.ts                            # AgentSummary (sin skills)
      - apps/studio-bridge/src/server/ws-server.ts                      # MAX_PAYLOAD_BYTES, 1009
      - apps/studio-bridge/src/server/router.ts                         # thread.send → sessions.send(threadId, text); MAX_READ_BYTES
      - apps/studio-bridge/src/engine/types.ts                          # EngineTurnInput.text: string
      - apps/studio-bridge/src/engine/claude-sdk-engine.ts              # QueryFn prompt: string
      - apps/studio-bridge/src/engine/fake-engine.ts                    # debe aceptar el nuevo input
      - apps/studio-bridge/src/sessions/store.ts                        # JSONL por hilo bajo .sdd-studio/
      - apps/studio-bridge/src/workspace/paths.ts                       # safePathWithinRoot
      - apps/studio-bridge/src/workspace/snapshot.ts                    # loadAgents(sdd/agents)
      - apps/studio/src/components/workspace/Timeline.tsx               # case 'user' → <p>{text}</p>
      - apps/studio/src/lib/store/timeline.ts                           # TimelineItem user {id, seq, text}
  sidebar_sessions_navigation:
    summary: |
      SessionStatus = queued | running | waiting-approval | idle | interrupted | error; ThreadInfo
      {id, channelId, title, agent, options, status, createdAt, lastActivity} — sin vínculo a
      spec/ciclo/fix. El puente emite thread.updated en cada cambio y bootstrap carga thread.list,
      así que la web ya tiene todos los hilos con estado. Sidebar.tsx muestra canales del sistema,
      canales spec:<id> y DMs con presencia; no hay SPECS/FIXES, ni árbol, ni colapsables, ni hilos.
      ChannelView lista hilos de un canal; RightPanel muestra actividad. La navegación es useState
      en Workspace.tsx ({channelId, threadId|null}).
    how_bridge_reads_sdd: |
      workspace/snapshot.ts → loadWorkspaceSnapshot(root): lee sdd/global.json, sdd/specs/index.json
      (SpecSummary) y cada sdd/specs/<id>/cycles/cycle-XX/{cycle,tasks}.json (CycleSummary con
      specId, cycle 'cycle-NN', status, tareas), sdd/fixes.json (FixSummary id/title/status),
      sdd/agents (AgentSummary), tools.json, pricing.json, kit.json. watcher.ts (chokidar sobre sdd/)
      debouncea y emite workspace.changed con las áreas cambiadas (mergeSnapshot / changedAreas).
      La asociación hilo↔ciclo/fix puede resolverse con estos datos: el ciclo in-progress de la spec
      del canal o el fix abierto.
    key_files:
      - libs/studio-protocol/src/domain.ts                              # SessionStatus, ThreadInfo, ChannelId
      - libs/studio-protocol/src/snapshot.ts                            # SpecSummary, CycleSummary, FixSummary, WorkspaceSnapshot
      - apps/studio-bridge/src/sessions/session-manager.ts              # createThread, list, applyStatus → thread.updated, cola por write scope
      - apps/studio-bridge/src/sessions/store.ts                        # threads.json (metadatos del hilo)
      - apps/studio-bridge/src/workspace/snapshot.ts
      - apps/studio-bridge/src/workspace/watcher.ts
      - apps/studio/src/components/workspace/Sidebar.tsx                # nav overflow-y-auto; secciones fijas
      - apps/studio/src/components/workspace/Workspace.tsx              # view state; <main overflow-hidden>
      - apps/studio/src/components/workspace/ChannelView.tsx            # lista de hilos del canal, StatusBadge
      - apps/studio/src/components/workspace/ThreadView.tsx             # stick-to-bottom (NEAR_BOTTOM_PX)
      - apps/studio/src/components/workspace/RightPanel.tsx
      - apps/studio/src/lib/store/state.ts                              # StudioState {snapshot, threads, presence, bot, runs}
      - apps/studio/src/lib/store/selectors.ts                          # threadsInChannel, pendingApprovals, channelsOf
      - apps/studio/src/lib/bridge/bootstrap.ts                         # thread.list al conectar
  queued_messages:
    summary: |
      Hoy no se puede escribir a un hilo ocupado: SessionManager.send(threadId, text) lanza
      SessionError('conflict', 'the thread is busy: wait or interrupt it') si live.turn o
      live.queued !== null; la única vía es thread.interrupt (AbortController + q.interrupt()).
      El engine llama query({prompt: string}): un turno = un prompt, sin canal para inyectar
      mensajes durante el turno. HU-10 requiere prompt streaming (AsyncIterable<SDKUserMessage>)
      para empujar el mensaje encolado en el próximo punto de corte (tras el tool en curso), o el
      mecanismo equivalente que el SDK 0.3.292 ofrezca; el Arquitecto lo verifica contra el SDK real.
      No hay estado de "mensaje pendiente" ni comandos para editar/quitar en el protocolo.
    key_files:
      - apps/studio-bridge/src/engine/claude-sdk-engine.ts              # QueryFn prompt: string; run/interrupt del turno
      - apps/studio-bridge/src/engine/types.ts                          # EngineTurnInput, EngineTurn
      - apps/studio-bridge/src/engine/fake-engine.ts                    # debe simular puntos de corte y entrega de encolados
      - apps/studio-bridge/src/sessions/session-manager.ts              # send (conflict), Live.turn/queued, drain, interrupt, recover
      - apps/studio-bridge/src/sessions/store.ts                        # persistencia de eventos user.message
      - libs/studio-protocol/src/commands.ts                            # thread.send (+ nuevos: editar/quitar encolado)
      - libs/studio-protocol/src/events.ts                              # user.message (+ estado pendiente/entregado/quitado)
      - apps/studio/src/components/workspace/Composer.tsx               # hoy deshabilita/rechaza envío con hilo ocupado
      - apps/studio/src/components/workspace/ThreadView.tsx             # render de encolados, interrupt
      - apps/studio/src/lib/store/timeline.ts                           # items user + estado de cola
  activity_and_scroll:
    summary: |
      Presencia por agente (working | waiting | open | idle) con puntos en Sidebar; no hay
      animaciones de trabajo en hilo/lista/avatar. ThreadView ya tiene stick-to-bottom
      (NEAR_BOTTOM_PX) pero debe revisarse con streaming/adjuntos; Sidebar y RightPanel usan
      overflow-y-auto; ChannelView scrollea la lista; Workspace <main> overflow-hidden. El
      implementor debe reproducir y listar los problemas concretos antes de arreglarlos.
    key_files:
      - apps/studio/src/components/workspace/ThreadView.tsx
      - apps/studio/src/components/workspace/Timeline.tsx
      - apps/studio/src/components/workspace/ChannelView.tsx
      - apps/studio/src/components/workspace/Sidebar.tsx
      - apps/studio/src/components/workspace/RightPanel.tsx
      - apps/studio/src/components/workspace/Workspace.tsx
  tests:
    - "protocol: vitest node — commands/events/domain/codec/handshake/snapshot .spec.ts"
    - "bridge: vitest node — session-manager.spec.ts, claude-sdk-engine.spec.ts (+ e2e), ws-server.spec.ts, router.spec.ts, store.spec.ts, judge.spec.ts, fake-engine.spec.ts, snapshot/watcher"
    - "studio: vitest jsdom — approval/composer/timeline/sidebar/channelview/rightpanel .spec.tsx, lib/store/*.spec.ts, lib/bridge/client.spec.ts; Playwright e2e/studio.e2e.ts con --engine fake"

resolved_decisions:
  - "Q1 alcance de 'Always' → RESUELTA: por herramienta para Edit/Write/MultiEdit/NotebookEdit; por tool puntual para mcp__srv__tool; por prefijo de comando para Bash (el Arquitecto define cómo se calcula el prefijo y cómo se muestra en la tarjeta)"
  - "Q2 vida de la regla → RESUELTA: mientras viva el hilo en el puente, en memoria (como hoy); sin persistencia ni nivel proyecto"
  - "Q3 warn del gate → RESUELTA: los warn siguen preguntando siempre; los deny siguen bloqueando"
  - "Q4 adjuntos en historial → RESUELTA: persistencia por hash en .sdd-studio/attachments/<sha256>.<ext>; se ven al recargar"
  - "Q5 límites → RESUELTA: hasta 5 adjuntos por mensaje; lado mayor 1568 px; imágenes png/jpg/webp/gif, PDF, texto/código/markdown; se respeta maxPayload 1 MiB midiendo el JSON serializado"
  - "Q6 hilos activos → RESUELTA: en el Sidebar; estados running / waiting-approval / queued; navegación a cada uno"
  - "Asociación hilo↔ciclo/fix → RESUELTA: automática al crear (spec del canal + ciclo in-progress, o fix abierto), reasignable desde el hilo, hilos viejos por canal"
  - "SPECS/FIXES → RESUELTA: todas las specs incluidas completadas; fixes abiertos + últimos cerrados"
  - "Corte de ciclos → RESUELTA (opción A del planner): cycle-01 = HU-4..HU-10 + contratos de protocolo de toda la spec (un bump); cycle-02 = HU-1..HU-3 (puente + Composer)"
  - "HU-10 → RESUELTA: imperativa en cycle-01; entrega en el próximo punto de corte del turno (no al final); UI pendiente → entregado con editar/quitar mientras pendiente; requiere prompt streaming del SDK en cycle-01"
  - "Canales spec:* → RESUELTA: no se mantienen en CANALES, solo bajo SPECS"
  - "Borrador del Composer → RESUELTA: por hilo, en memoria, texto y adjuntos; se pierde al recargar"
  - "EXIF/GPS → RESUELTA: las imágenes se re-encodean siempre en el cliente (cycle-02)"

open_questions:
  - "Para el Arquitecto: ¿cuántos fixes cerrados son 'los últimos' (sugerido: 5 o los de los últimos 14 días)?"
  - "Para el Arquitecto: ¿cómo se sirven los adjuntos persistidos a la web al recargar (comando nuevo vs workspace.readFile acotado a .sdd-studio/attachments) respetando el frame de 1 MiB?"

risks:
  - "R1 tamaño: resuelto con el corte en dos ciclos. cycle-01 sigue siendo grande (7 historias + contratos de toda la spec + prompt streaming); el Planner mantiene fases con checkpoint de tests verdes: F1 protocolo (un bump) · F2 puente (streaming + cola HU-10, Always, vínculo hilo↔ciclo/fix) · F3 web (Sidebar SPECS/FIXES colapsable, hilos activos, indicadores, scroll, cola en ThreadView/Composer, borrador por hilo)"
  - "R2 PROTOCOL_VERSION: los cambios (adjuntos en thread.send/create y user.message, vínculo en ThreadInfo, comandos de búsqueda/reasignación, skills en el snapshot, regla en approval) probablemente no son retrocompatibles; el handshake exige igualdad, y la web en Cloudflare y el puente en npm pueden desfasarse. Hacer un único bump en F1 y mensaje de error claro de versión"
  - "R3 prompt streaming del SDK — ADELANTADO A cycle-01 por HU-10: pasar QueryFn de prompt string a AsyncIterable<SDKUserMessage> cambia el ciclo de vida del turno (fin de turno con el iterable abierto, interrupt/AbortController, resume, recover tras reinicio); verificar contra el SDK 0.3.292 real (claude-sdk-engine.e2e.spec.ts) que un mensaje empujado durante el turno se lee tras el tool en curso y no recién al final; adaptar fake-engine para simular puntos de corte"
  - "R9 semántica de la cola (HU-10): carrera entre editar/quitar un pendiente y su entrega (el puente es la fuente de verdad; editar/quitar un mensaje ya entregado debe fallar con error claro); interacción con waiting-approval (¿se entrega al resolver la aprobación?), con interrupt (los pendientes no se pierden) y con la cola por write scope existente (status queued de hilos bloqueados ≠ mensajes encolados: no confundir en protocolo ni UI)"
  - "R10 contratos sin consumidor en cycle-01 (HU-1..3): riesgo de diseñarlos mal sin uso real; cubrirlos con tests zod y revisarlos al abrir cycle-02 (cualquier ajuste debe ser retrocompatible para no forzar otro bump)"
  - "R4 (cycle-02) frame de 1 MiB: base64 +33% → ~750 KB binarios para todo el mensaje con hasta 5 adjuntos; un PDF grande puede no entrar aun recomprimiendo imágenes. El cliente mide el JSON serializado y rechaza antes de enviar; un frame > maxPayload cierra el socket (1009) y dispara reconexión"
  - "R6 seguridad: 'Always' por herramienta en Edit/Write reduce la protección del modo ask (mitigado: warn/deny del gate intactos); la búsqueda de archivos y la lectura de adjuntos deben pasar por safePathWithinRoot y no exponer archivos fuera del root ni secretos (.env)"
  - "R7 crecimiento de .sdd-studio/attachments sin límite: considerar dedupe por hash (ya implícito) y no borrar en este ciclo"
  - "R8 dato desactualizado en contexto (Next 15 vs 16.4.3) puede inducir a errores de API de Next en el implementor front"

